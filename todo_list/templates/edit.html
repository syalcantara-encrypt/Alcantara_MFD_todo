{% extends 'base.html' %}

{% block title %}Edit Todo{% endblock %}

{% block content %}

<h1 class="mb-4">Edit Todo</h1>

<div class="card p-4">

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Todo Title
            </label>

            {{ form.title }}

        </div>

        {% if form.errors %}

            <div class="alert alert-danger">

                Please correct the error below.

                {{ form.errors }}

            </div>

        {% endif %}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Changes
        </button>

        <a
            href="{% url 'home' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
