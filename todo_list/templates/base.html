<!DOCTYPE html>
<html>

<head>
    <title>
        {% block title %}
        My Todo App
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'home' %}"
        >
            My Todo App
        </a>

        <div>

            <a
                class="btn btn-outline-light"
                href="{% url 'home' %}"
            >
                Home
            </a>

            <a
                class="btn btn-outline-light"
                href="{% url 'about' %}"
            >
                About
            </a>

            {% if user.is_authenticated %}

                <a
                    class="btn btn-danger"
                    href="{% url 'logout' %}"
                >
                    Logout
                </a>

            {% else %}

                <a
                    class="btn btn-success"
                    href="{% url 'login' %}"
                >
                    Login
                </a>

            {% endif %}

        </div>

    </div>
</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
